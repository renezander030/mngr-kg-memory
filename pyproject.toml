[project]
name = "mngr-kg-memory"
version = "0.1.0"
description = "Give a mngr agent memory of earlier decisions, so it does not start from scratch"
requires-python = ">=3.12"
dependencies = ["imbue-mngr", "click", "pydantic>=2"]

[project.entry-points.mngr]
kg_memory = "imbue.mngr_kg_memory.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imbue"]
exclude = ["*_test.py", "test_*.py", "**/conftest.py"]
